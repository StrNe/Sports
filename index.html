<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="description" content="Life : séances, course à pied, sommeil, récupération, calories et tâches ménagères au même endroit." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Life" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Life</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash
      // Sombre par défaut ; « auto » suit l'appareil
      var t
      try {
        t = JSON.parse(localStorage.getItem('foulee-data') || '{}').state?.theme
      } catch (e) {}
      if (t !== 'light' && !(t === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
